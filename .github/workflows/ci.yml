name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_TITLE: Movie Recommendation API CI
      APP_VERSION: ci
      # Tests mock database access; no PostgreSQL service is required.
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/movie_ci
      LOG_LEVEL: INFO
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q
