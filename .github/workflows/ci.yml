name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks, Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      checked_sha: ${{ steps.image_metadata.outputs.checked_sha }}
      local_image: ${{ steps.image_metadata.outputs.local_image }}
      image_id: ${{ steps.image_inspect.outputs.image_id }}
    env:
      APP_TITLE: Movie Recommendation API CI
      APP_VERSION: ci
      # Unit tests mock database access; Compose provides its own database URL.
      DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/movie_ci
      LOG_LEVEL: INFO
      # Settings validation requires explicit fake integration values; CI never calls TMDB.
      TMDB_BASE_URL: https://tmdb.invalid/3
      TMDB_READ_ACCESS_TOKEN: ci-fake-tmdb-read-access-token
      TMDB_TIMEOUT_SECONDS: "5"
      COMPOSE_FILE: .github/compose.ci.yml
      COMPOSE_PROJECT_NAME: movie-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Set Docker image metadata
        id: image_metadata
        run: |
          checked_sha=$(git rev-parse HEAD)
          local_image="movie-recommendation-api:${checked_sha}"
          echo "CI_IMAGE=${local_image}" >> "$GITHUB_ENV"
          echo "checked_sha=${checked_sha}" >> "$GITHUB_OUTPUT"
          echo "local_image=${local_image}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build --tag "$CI_IMAGE" .

      - name: Verify image is available locally
        id: image_inspect
        run: |
          image_id=$(docker image inspect "$CI_IMAGE" --format '{{.Id}}')
          echo "$image_id"
          echo "image_id=${image_id}" >> "$GITHUB_OUTPUT"

      - name: Start isolated smoke services
        id: smoke_start
        timeout-minutes: 3
        run: docker compose --env-file /dev/null up --no-build --wait --wait-timeout 120

      - name: Verify migrations and health endpoints
        timeout-minutes: 1
        run: bash .github/scripts/verify-smoke.sh

      - name: Collect smoke failure logs
        if: failure() && steps.smoke_start.outcome != 'skipped'
        timeout-minutes: 1
        run: docker compose --env-file /dev/null logs --no-color --timestamps

      - name: Clean up smoke resources
        if: always() && steps.smoke_start.outcome != 'skipped'
        timeout-minutes: 1
        run: docker compose --env-file /dev/null down --volumes --remove-orphans --timeout 10

      - name: Export verified image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output "$RUNNER_TEMP/verified-image.tar" "$CI_IMAGE"

      - name: Upload verified image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: verified-image-${{ steps.image_metadata.outputs.checked_sha }}
          path: ${{ runner.temp }}/verified-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish verified image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.registry_metadata.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Download verified image artifact
        uses: actions/download-artifact@v5
        with:
          name: verified-image-${{ needs.checks.outputs.checked_sha }}
          path: ${{ runner.temp }}

      - name: Load and verify image
        run: |
          docker load --input "$RUNNER_TEMP/verified-image.tar"
          actual_id=$(docker image inspect "${{ needs.checks.outputs.local_image }}" --format '{{.Id}}')
          test "$actual_id" = "${{ needs.checks.outputs.image_id }}"

      - name: Set registry image reference
        id: registry_metadata
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repository}:sha-${{ needs.checks.outputs.checked_sha }}"
          echo "PUBLISHED_IMAGE=${image}" >> "$GITHUB_ENV"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push verified image
        id: push
        run: |
          docker tag "${{ needs.checks.outputs.local_image }}" "$PUBLISHED_IMAGE"
          docker push "$PUBLISHED_IMAGE"
          digest=$(docker buildx imagetools inspect "$PUBLISHED_IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')
          test "${digest#sha256:}" != "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          printf 'Published `%s@%s`\n' "$PUBLISHED_IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
