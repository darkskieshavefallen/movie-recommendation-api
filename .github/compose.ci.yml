services:
  api:
    image: ${CI_IMAGE:?CI_IMAGE must identify the image built in CI}
    pull_policy: never
    environment:
      APP_TITLE: Movie Recommendation API CI
      APP_VERSION: ci
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://ci:ci@db:5432/movie_ci
      TMDB_BASE_URL: https://tmdb.invalid/3
      TMDB_READ_ACCESS_TOKEN: ci-fake-tmdb-read-access-token
      TMDB_TIMEOUT_SECONDS: "5"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=3).status == 200"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: movie_ci
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U ci -d movie_ci"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
