services:
  api:
    image: ${APP_IMAGE:?Set APP_IMAGE to an exact GHCR SHA tag or digest}
    pull_policy: always
    environment:
      APP_TITLE: Movie Recommendation API GHCR Verification
      APP_VERSION: ghcr
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://ci:ci@db:5432/movie_ci
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=3).status == 200"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: movie_ci
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U ci -d movie_ci"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
